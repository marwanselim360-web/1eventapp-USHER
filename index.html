<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>1eventapp - Ushers & Event Deck Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0f19; color: #f3f4f6; }
    .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-card { background: rgba(31, 41, 55, 0.5); border: 1px solid rgba(255,255,255,0.05); }
    .glow-hover:hover { border-color: rgba(99, 102, 241, 0.4); box-shadow: 0 0 20px rgba(99, 102, 241, 0.15); }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="glass sticky top-0 z-40 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3 cursor-pointer" onclick="goHome()">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-bold text-white shadow-lg">
        1E
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight">1eventapp</h1>
        <p class="text-xs text-gray-400">Usher & Event Deck Manager</p>
      </div>
    </div>
    <div id="header-actions" class="flex gap-2"></div>
  </header>

  <!-- Main Content Container -->
  <main id="app" class="flex-1 max-w-7xl w-full mx-auto p-6"></main>

  <!-- Add Usher Modal -->
  <div id="usher-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-card max-w-md w-full rounded-2xl p-6 border border-gray-700">
      <h3 class="text-xl font-bold mb-4">Add New Usher</h3>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Usher Name *</label>
          <input type="text" id="modal-usher-name" placeholder="e.g. Mohamed" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500"/>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Role / Position</label>
          <input type="text" id="modal-usher-role" placeholder="e.g. Registration Usher" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500"/>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 mb-1">Select Photos</label>
          <input type="file" id="modal-usher-photos" accept="image/*" multiple class="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer"/>
        </div>
      </div>

      <div class="flex gap-3 mt-6">
        <button onclick="closeUsherModal()" class="flex-1 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-sm font-semibold">Cancel</button>
        <button onclick="submitNewUsher()" class="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold">Save Usher</button>
      </div>
    </div>
  </div>

  <script>
    // --- IndexedDB Setup ---
    const DB_NAME = '1eventapp_UsherDB';
    const DB_VERSION = 1;
    let db;

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('projects')) {
            database.createObjectStore('projects', { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = (e) => reject(e);
      });
    }

    function getAllProjects() {
      return new Promise((resolve) => {
        const tx = db.transaction('projects', 'readonly');
        const store = tx.objectStore('projects');
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    function saveProject(proj) {
      return new Promise((resolve) => {
        const tx = db.transaction('projects', 'readwrite');
        const store = tx.objectStore('projects');
        store.put(proj);
        tx.oncomplete = () => resolve();
      });
    }

    function deleteProject(id) {
      return new Promise((resolve) => {
        const tx = db.transaction('projects', 'readwrite');
        const store = tx.objectStore('projects');
        store.delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    // --- State ---
    let projects = [];
    let currentProjectId = null;
    let viewMode = 'list';
    let mediaRecorder = null;
    let audioChunks = [];
    let activeRecordingUsherId = null;

    window.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      projects = await getAllProjects();
      render();
    });

    function goHome() {
      currentProjectId = null;
      viewMode = 'list';
      render();
    }

    function render() {
      const app = document.getElementById('app');
      const headerActions = document.getElementById('header-actions');
      headerActions.innerHTML = '';

      if (viewMode === 'list') {
        renderProjectList(app);
      } else if (viewMode === 'detail') {
        renderProjectDetail(app, headerActions);
      } else if (viewMode === 'client') {
        renderClientView(app, headerActions);
      }
    }

    // --- 1. Projects Dashboard ---
    function renderProjectList(app) {
      let html = `
        <div class="flex items-center justify-between mb-8">
          <div>
            <h2 class="text-2xl font-bold">Event Projects</h2>
            <p class="text-gray-400 text-sm">Select an event folder or create a new deck for your client.</p>
          </div>
          <button onclick="createNewProject()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold text-sm flex items-center gap-2 transition-all shadow-lg shadow-indigo-600/20">
            <i class="fa-solid fa-folder-plus"></i> New Event Folder
          </button>
        </div>
      `;

      if (projects.length === 0) {
        html += `
          <div class="glass-card rounded-2xl p-12 text-center max-w-md mx-auto my-12">
            <div class="w-16 h-16 rounded-full bg-indigo-500/10 text-indigo-400 flex items-center justify-center mx-auto mb-4 text-2xl">
              <i class="fa-solid fa-folder-open"></i>
            </div>
            <h3 class="text-lg font-bold mb-1">No Event Folders Yet</h3>
            <p class="text-gray-400 text-sm mb-6">Create a new folder to start adding Ushers, Multiple Photos, and Voice Notes.</p>
            <button onclick="createNewProject()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold">
              + Create First Event
            </button>
          </div>
        `;
      } else {
        html += `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
        projects.forEach(p => {
          const usherCount = p.ushers ? p.ushers.length : 0;
          html += `
            <div onclick="openProject('${p.id}')" class="glass-card glow-hover rounded-2xl p-6 cursor-pointer transition-all flex flex-col justify-between group relative">
              <div>
                <div class="flex items-start justify-between mb-4">
                  <div class="w-12 h-12 rounded-xl bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
                    <i class="fa-solid fa-folder"></i>
                  </div>
                  <button onclick="event.stopPropagation(); removeProject('${p.id}')" class="text-gray-500 hover:text-red-400 p-2 text-sm transition-colors">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
                <h3 class="font-bold text-lg mb-1 group-hover:text-indigo-400 transition-colors">${escapeHtml(p.title)}</h3>
                <p class="text-xs text-gray-400 line-clamp-2 mb-4">${escapeHtml(p.clientName || 'Client Pitch')}</p>
              </div>
              <div class="pt-4 border-t border-gray-800 flex items-center justify-between text-xs text-gray-400">
                <span><i class="fa-solid fa-users mr-1"></i> ${usherCount} Ushers</span>
                <span class="text-indigo-400 font-semibold group-hover:translate-x-1 transition-transform">Open Folder &rarr;</span>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }

      app.innerHTML = html;
    }

    async function createNewProject() {
      const name = prompt('Enter Event Folder Name:');
      if (!name) return;
      const client = prompt('Client Name / Company (Optional):') || '';
      
      const newProj = {
        id: 'proj_' + Date.now(),
        title: name,
        clientName: client,
        ushers: [],
        createdAt: new Date().toISOString()
      };

      projects.push(newProj);
      await saveProject(newProj);
      openProject(newProj.id);
    }

    function openProject(id) {
      currentProjectId = id;
      viewMode = 'detail';
      render();
    }

    async function removeProject(id) {
      if (!confirm('Are you sure you want to delete this folder?')) return;
      projects = projects.filter(p => p.id !== id);
      await deleteProject(id);
      render();
    }

    // --- 2. Folder Detail ---
    function renderProjectDetail(app, headerActions) {
      const proj = projects.find(p => p.id === currentProjectId);
      if (!proj) return goHome();

      headerActions.innerHTML = `
        <button onclick="viewMode='client'; render();" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-sm font-semibold flex items-center gap-2 shadow-lg shadow-emerald-600/20">
          <i class="fa-solid fa-paper-plane"></i> Launch Client Mode
        </button>
      `;

      let html = `
        <div class="mb-6 flex items-center gap-2 text-sm text-gray-400">
          <span onclick="goHome()" class="hover:text-white cursor-pointer">Events</span>
          <span>/</span>
          <span class="text-white font-medium">${escapeHtml(proj.title)}</span>
        </div>

        <div class="glass-card rounded-2xl p-6 mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <h2 class="text-2xl font-bold mb-1">${escapeHtml(proj.title)}</h2>
            <p class="text-sm text-gray-400">Client: <span class="text-indigo-400 font-semibold">${escapeHtml(proj.clientName || 'General')}</span></p>
          </div>
          <button onclick="openUsherModal()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold flex items-center gap-2">
            <i class="fa-solid fa-user-plus"></i> + Add New Usher
          </button>
        </div>

        <h3 class="text-lg font-bold mb-4">Ushers in this Deck (${proj.ushers ? proj.ushers.length : 0})</h3>
      `;

      if (!proj.ushers || proj.ushers.length === 0) {
        html += `
          <div class="border-2 border-dashed border-gray-800 rounded-2xl p-12 text-center">
            <p class="text-gray-400 text-sm mb-4">No Ushers added to this event folder yet.</p>
            <button onclick="openUsherModal()" class="px-4 py-2 rounded-xl bg-indigo-600 text-sm font-semibold">+ Add First Usher</button>
          </div>
        `;
      } else {
        html += `<div class="grid grid-cols-1 lg:grid-cols-2 gap-6">`;
        proj.ushers.forEach((u) => {
          const photoList = u.photos || [];
          html += `
            <div class="glass-card rounded-2xl p-5 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-4">
                  <div>
                    <h4 class="font-bold text-xl text-white">${escapeHtml(u.name)}</h4>
                    <p class="text-xs text-indigo-400 font-medium">${escapeHtml(u.role || 'Usher Staff')}</p>
                  </div>
                  <button onclick="deleteUsher('${u.id}')" class="text-gray-500 hover:text-red-400 p-2 text-sm transition-colors">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>

                <div class="mb-4">
                  <div class="flex items-center justify-between text-xs font-semibold text-gray-400 mb-2">
                    <span><i class="fa-solid fa-images mr-1 text-indigo-400"></i> Photos (${photoList.length})</span>
                    <label class="text-indigo-400 hover:underline cursor-pointer">
                      + Add Photos
                      <input type="file" accept="image/*" multiple onchange="appendUsherPhotos(event, '${u.id}')" class="hidden"/>
                    </label>
                  </div>

                  ${photoList.length === 0 ? `
                    <div class="h-32 bg-gray-900/50 rounded-xl border border-dashed border-gray-800 flex items-center justify-center text-xs text-gray-500">
                      No photos added yet
                    </div>
                  ` : `
                    <div class="grid grid-cols-3 gap-2">
                      ${photoList.map((img, imgIdx) => `
                        <div class="relative group h-28 rounded-lg overflow-hidden bg-gray-900">
                          <img src="${img}" class="w-full h-full object-cover"/>
                          <button onclick="removeUsherPhoto('${u.id}', ${imgIdx})" class="absolute top-1 right-1 w-6 h-6 rounded-full bg-black/70 text-white hover:bg-red-600 flex items-center justify-center text-[10px] opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="fa-solid fa-xmark"></i>
                          </button>
                        </div>
                      `).join('')}
                    </div>
                  `}
                </div>
              </div>

              <div class="bg-gray-900/60 rounded-xl p-3 border border-gray-800 mt-2">
                <div class="text-xs font-semibold text-gray-400 mb-2 flex items-center justify-between">
                  <span><i class="fa-solid fa-microphone mr-1 text-indigo-400"></i> Voice Note</span>
                  ${u.audio ? `<span class="text-emerald-400 text-[10px]"><i class="fa-solid fa-check"></i> Attached</span>` : ''}
                </div>
                
                ${u.audio ? `
                  <audio controls src="${u.audio}" class="w-full h-8 mb-2"></audio>
                  <button onclick="removeUsherAudio('${u.id}')" class="text-[11px] text-red-400 hover:underline">Remove Audio</button>
                ` : `
                  <div class="flex gap-2">
                    <button id="rec-btn-${u.id}" onclick="toggleRecordUsherAudio('${u.id}')" class="flex-1 py-1.5 rounded-lg bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 text-xs font-semibold border border-indigo-500/30 flex items-center justify-center gap-1">
                      <i class="fa-solid fa-circle text-red-500 text-[8px]"></i> Record Voice
                    </button>
                    <label class="px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs text-gray-300 cursor-pointer border border-gray-700 flex items-center justify-center">
                      <i class="fa-solid fa-upload"></i>
                      <input type="file" accept="audio/*" onchange="uploadUsherAudio(event, '${u.id}')" class="hidden"/>
                    </label>
                  </div>
                `}
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }

      app.innerHTML = html;
    }

    // Modal Operations
    function openUsherModal() {
      document.getElementById('modal-usher-name').value = '';
      document.getElementById('modal-usher-role').value = '';
      document.getElementById('modal-usher-photos').value = '';
      document.getElementById('usher-modal').classList.remove('hidden');
    }

    function closeUsherModal() {
      document.getElementById('usher-modal').classList.add('hidden');
    }

    async function submitNewUsher() {
      const name = document.getElementById('modal-usher-name').value.trim();
      const role = document.getElementById('modal-usher-role').value.trim() || 'Usher Staff';
      const fileInput = document.getElementById('modal-usher-photos');

      if (!name) {
        alert('Please enter usher name!');
        return;
      }

      let photos = [];
      if (fileInput.files && fileInput.files.length > 0) {
        for (let i = 0; i < fileInput.files.length; i++) {
          const base64 = await readFileAsBase64(fileInput.files[i]);
          photos.push(base64);
        }
      }

      const proj = projects.find(p => p.id === currentProjectId);
      if (!proj.ushers) proj.ushers = [];

      proj.ushers.push({
        id: 'u_' + Date.now(),
        name: name,
        role: role,
        photos: photos,
        audio: null
      });

      await saveProject(proj);
      closeUsherModal();
      render();
    }

    async function appendUsherPhotos(e, usherId) {
      if (!e.target.files || e.target.files.length === 0) return;
      const proj = projects.find(p => p.id === currentProjectId);
      const usher = proj.ushers.find(u => u.id === usherId);
      if (!usher) return;

      if (!usher.photos) usher.photos = [];
      for (let i = 0; i < e.target.files.length; i++) {
        const base64 = await readFileAsBase64(e.target.files[i]);
        usher.photos.push(base64);
      }

      await saveProject(proj);
      render();
    }

    async function removeUsherPhoto(usherId, photoIdx) {
      const proj = projects.find(p => p.id === currentProjectId);
      const usher = proj.ushers.find(u => u.id === usherId);
      if (usher && usher.photos) {
        usher.photos.splice(photoIdx, 1);
        await saveProject(proj);
        render();
      }
    }

    async function deleteUsher(usherId) {
      const proj = projects.find(p => p.id === currentProjectId);
      proj.ushers = proj.ushers.filter(u => u.id !== usherId);
      await saveProject(proj);
      render();
    }

    function readFileAsBase64(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.readAsDataURL(file);
      });
    }

    async function uploadUsherAudio(e, usherId) {
      const file = e.target.files[0];
      if (!file) return;
      const base64Audio = await readFileAsBase64(file);
      
      const proj = projects.find(p => p.id === currentProjectId);
      const usher = proj.ushers.find(u => u.id === usherId);
      if (usher) {
        usher.audio = base64Audio;
        await saveProject(proj);
        render();
      }
    }

    async function removeUsherAudio(usherId) {
      const proj = projects.find(p => p.id === currentProjectId);
      const usher = proj.ushers.find(u => u.id === usherId);
      if (usher) {
        usher.audio = null;
        await saveProject(proj);
        render();
      }
    }

    async function toggleRecordUsherAudio(usherId) {
      const btn = document.getElementById(`rec-btn-${usherId}`);
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        activeRecordingUsherId = usherId;

        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: 'audio/mp3' });
          const base64Audio = await readFileAsBase64(blob);
          
          const proj = projects.find(p => p.id === currentProjectId);
          const usher = proj.ushers.find(u => u.id === activeRecordingUsherId);
          if (usher) {
            usher.audio = base64Audio;
            await saveProject(proj);
            render();
          }
          stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();
        if (btn) {
          btn.classList.add('animate-pulse', 'bg-red-600', 'text-white');
          btn.innerHTML = `<i class="fa-solid fa-stop"></i> Stop Recording...`;
        }
      } catch (err) {
        alert('Microphone access is required to record audio.');
      }
    }

    // --- 3. Client Mode ---
    function renderClientView(app, headerActions) {
      const proj = projects.find(p => p.id === currentProjectId);
      if (!proj) return goHome();

      headerActions.innerHTML = `
        <button onclick="viewMode='detail'; render();" class="px-4 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 text-sm font-semibold flex items-center gap-2 border border-gray-700">
          <i class="fa-solid fa-pen-to-square"></i> Back to Builder Mode
        </button>
      `;

      let html = `
        <div class="text-center max-w-2xl mx-auto mb-12">
          <span class="px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-400 text-xs font-semibold border border-indigo-500/20 mb-3 inline-block">EXECUTIVE USHER DECK</span>
          <h2 class="text-3xl font-extrabold text-white mb-2">${escapeHtml(proj.title)}</h2>
          <p class="text-gray-400 text-sm">Prepared by 1eventapp for <span class="text-white font-medium">${escapeHtml(proj.clientName || 'Valued Client')}</span></p>
        </div>

        <div class="grid grid-cols-1 gap-12 max-w-4xl mx-auto">
      `;

      proj.ushers.forEach((u) => {
        const photos = u.photos || [];
        html += `
          <div class="glass-card glow-hover rounded-3xl p-6 flex flex-col gap-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-gray-800">
              <div>
                <h3 class="text-2xl font-bold text-white">${escapeHtml(u.name)}</h3>
                <p class="text-xs text-indigo-400 font-medium">${escapeHtml(u.role || 'Event Usher')}</p>
              </div>

              ${u.audio ? `
                <div class="flex items-center gap-3 bg-gray-900/80 px-4 py-2.5 rounded-2xl border border-gray-800">
                  <button onclick="playDeckAudio(this)" class="w-10 h-10 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center text-sm shadow-md transition-transform active:scale-95">
                    <i class="fa-solid fa-play ml-0.5"></i>
                  </button>
                  <audio src="${u.audio}" onended="resetAudioBtn(this)"></audio>
                  <div>
                    <div class="text-xs font-semibold text-gray-200">Voice Note</div>
                    <div class="text-[10px] text-gray-400">Listen to details</div>
                  </div>
                </div>
              ` : ''}
            </div>

            ${photos.length === 0 ? `
              <div class="h-40 bg-gray-900/40 rounded-2xl flex items-center justify-center text-xs text-gray-500">
                No photos provided
              </div>
            ` : `
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                ${photos.map((pUrl, pIdx) => `
                  <div onclick="openLightbox('${u.id}', ${pIdx})" class="h-64 rounded-2xl overflow-hidden bg-gray-900 cursor-pointer group relative">
                    <img src="${pUrl}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"/>
                    <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                      <i class="fa-solid fa-expand text-white text-xl"></i>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        `;
      });

      html += `</div>`;
      app.innerHTML = html;
    }

    function playDeckAudio(btn) {
      const audio = btn.nextElementSibling;
      if (audio.paused) {
        document.querySelectorAll('audio').forEach(a => { a.pause(); });
        document.querySelectorAll('.fa-pause').forEach(i => { i.className = 'fa-solid fa-play ml-0.5'; });
        audio.play();
        btn.querySelector('i').className = 'fa-solid fa-pause';
      } else {
        audio.pause();
        btn.querySelector('i').className = 'fa-solid fa-play ml-0.5';
      }
    }

    function resetAudioBtn(audio) {
      const btn = audio.previousElementSibling;
      if (btn) btn.querySelector('i').className = 'fa-solid fa-play ml-0.5';
    }

    function openLightbox(usherId, photoIdx) {
      const proj = projects.find(p => p.id === currentProjectId);
      const usher = proj.ushers.find(u => u.id === usherId);
      if (!usher || !usher.photos || !usher.photos[photoIdx]) return;

      const imgUrl = usher.photos[photoIdx];
      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 backdrop-blur-md';
      modal.onclick = () => modal.remove();
      modal.innerHTML = `
        <div class="relative max-w-4xl w-full max-h-[90vh] flex flex-col items-center justify-center">
          <img src="${imgUrl}" class="max-w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl"/>
          <p class="text-white font-semibold mt-4">${escapeHtml(usher.name)} - Photo ${photoIdx + 1}</p>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
